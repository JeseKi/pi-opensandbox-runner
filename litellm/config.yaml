# Provider credentials are intentionally resolved only inside the LiteLLM container
# from .litellm.env. Keep model aliases in sync with config/runner-catalog.json.
model_list:
  - model_name: coding-default
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com/v1
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  require_key_mcp_access_defined: true

litellm_settings:
  set_verbose: false
  json_logs: true
  timezone: "Asia/Shanghai"
  default_key_generate_params:
    models: ["coding-default"]
    max_budget: 5
    budget_duration: "24h"
    max_parallel_requests: 2
    rpm_limit: 30
    tpm_limit: 1000000
