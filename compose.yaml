services:
  opensandbox:
    image: pi-opensandbox-runner-opensandbox:local
    build:
      context: .
      dockerfile: Dockerfile.opensandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.runtime/opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-control:/root/.opensandbox
    networks:
      - pi-runner-internal

volumes:
  opensandbox-control:

networks:
  pi-runner-internal:
    name: pi-runner-internal
