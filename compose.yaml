services:
  opensandbox:
    image: opensandbox/server:v0.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.runtime/opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-control:/root/.opensandbox

volumes:
  opensandbox-control:
