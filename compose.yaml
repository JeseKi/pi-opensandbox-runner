services:
  opensandbox:
    image: pi-opensandbox-runner-opensandbox:local
    build:
      context: .
      dockerfile: Dockerfile.opensandbox
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.runtime/opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-control:/root/.opensandbox
    networks:
      - pi-runner-internal
      - pi-runner-control

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    restart: unless-stopped
    env_file:
      - ./.litellm.env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - pi-runner-internal
      - pi-runner-control

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pi-runner-control

  manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    restart: unless-stopped
    env_file:
      - path: ./.manager.env
        required: false
    environment:
      RUNNER_MANAGER_DATABASE_URL: sqlite:////app/data/runner-manager.db
      RUNNER_MANAGER_HOST: 0.0.0.0
      RUNNER_MANAGER_PORT: "8090"
      OPENSANDBOX_BASE_URL: http://opensandbox:8080
      LITELLM_BASE_URL: http://litellm:4000
    volumes:
      - manager-data:/app/data
      - ./config/runner-catalog.json:/app/config/runner-catalog.json:ro
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - opensandbox
      - litellm
    networks:
      - pi-runner-control
      - manager-ingress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  opensandbox-control:
  litellm-db:
  manager-data:

networks:
  manager-ingress:
  pi-runner-internal:
    name: pi-runner-internal
  pi-runner-control:
    internal: true
