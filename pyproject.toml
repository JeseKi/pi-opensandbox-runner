[project]
name = "pi-opensandbox-runner"
version = "0.1.0"
description = "HTTP bridge for running persistent Pi sessions inside OpenSandbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.16.5",
    "cryptography==45.0.7",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.35",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
pi-opensandbox-runner = "pi_opensandbox_runner.__main__:main"
pi-runner-manager = "pi_opensandbox_manager.__main__:main"
pi-runner-manager-cli = "pi_opensandbox_manager.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_opensandbox_runner", "src/pi_opensandbox_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pi_opensandbox_manager/app/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
